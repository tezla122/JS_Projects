<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="overlay"></div>

    <div class="app-wrap">
        <header>
            <input type="text" autocomplete="off" class="search-box" id="input-box" placeholder="Search city...">
        </header>

        <main class="weather-body" style="display: none;">
            <section class="location">
                <div class="city" id="location">--</div>
                <div class="date" id="date">--</div>
            </section>

            <div class="current">
                <div class="temp">
                    <span class="c">--</span>
                </div>
                <div class="weather desc">--</div>
                <div class="hi-low"></div>
            </div>

            <div class="more-info">
                <div class="info-block">
                    <div class="label">Humidity</div>
                    <div class="val" id="humidity">--%</div>
                </div>
                <div class="info-block">
                    <div class="label">Wind</div>
                    <div class="val" id="wind">-- km/h</div>
                </div>
            </div>
        </main>
    </div>

    <script src="scrpit.js"></script>
</body>
</html>
